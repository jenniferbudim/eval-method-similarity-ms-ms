name: ms2env-stable
channels:
  - conda-forge
channel_priority: strict

dependencies:
  - python=3.10
  - pytables
  - pip

  # GPU runtime
  - cudatoolkit=11.8
  - cudnn=8.9

  # compiled stack
  - numpy=1.24.4
  - pandas=2.2.2
  - scipy=1.10.1
  - scikit-learn=1.3.0
  - h5py=3.10.0
  - rdkit
  - numba
  - llvmlite=0.40.1

  # compression libs
  - lz4-c
  - blosc
  - snappy
  - zstd
  - zlib

  # dask stack
  - dask
  - dask-expr
  - distributed

  # jupyter toolchain
  - ipykernel
  - pyzmq

  - pip:
      - -r requirements-pip.txt